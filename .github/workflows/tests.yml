name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check code quality
        run: ruff check .

      - name: Audit deployment dependencies
        run: pip-audit -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Verify training workflow
        run: python train_model.py

      - name: Verify model benchmark
        run: python benchmark_models.py

      - name: Verify fairness audit
        run: python fairness_audit.py

      - name: Execute analysis notebook
        run: >-
          jupyter nbconvert --to notebook --execute credit_wise.ipynb
          --output credit_wise_executed.ipynb --output-dir /tmp
          --ExecutePreprocessor.timeout=120

      - name: Confirm committed reports are reproducible
        run: git diff --exit-code -- reports
